<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>和樂邨 & 翠屏邨 實時巴士看板</title>
  <style>
    /* 黑底高對比，適合電視大螢幕顯示 */
    body {
      margin: 0;
      padding: 2vw;
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .header {
      font-size: 2.5vw;
      font-weight: 800;
      color: #aaa;
      margin-bottom: 1.5vw;
      border-bottom: 2px solid #333;
      padding-bottom: 0.8vw;
      display: flex;
      justify-content: space-between;
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 1.2vw;
    }

    /* 單一路線欄位 */
    .route-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a1a;
      padding: 1.2vw 2vw;
      border-radius: 0.8vw;
      border-left: 0.8vw solid #00d26a;
    }

    .route-info {
      display: flex;
      align-items: center;
      gap: 1.5vw;
    }

    /* 巴士號碼牌 */
    .route-badge {
      font-size: 3vw;
      font-weight: 900;
      background: #ffd600;
      color: #000;
      padding: 0.3vw 1vw;
      border-radius: 0.5vw;
      min-width: 5vw;
      text-align: center;
    }

    /* 車站與目的地 */
    .station-info {
      display: flex;
      flex-direction: column;
    }

    .station-name {
      font-size: 1.5vw;
      color: #888;
    }

    .dest-name {
      font-size: 2.2vw;
      font-weight: 700;
      color: #ffffff;
    }

    /* 到站時間字體 */
    .time-box {
      font-size: 3.5vw;
      font-weight: 900;
      color: #00e676;
    }

    /* 即將到站醒目提示 */
    .arriving {
      color: #ff3d00 !important;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="header">
    <span>和樂邨 / 翠屏邨 巴士看板</span>
    <span id="clock">00:00</span>
  </div>

  <div class="board" id="board">
    <div style="font-size: 2vw; color: #888;">正從九巴 API 載入車站資料...</div>
  </div>

  <script>
    // 觀塘協和街（和樂邨雙向）& 翠屏道（翠屏邨所有站）九巴官方 ID
    const STATIONS = [
      { id: "A28469C365DE1A45", name: "和樂邨 (往觀塘/秀茂坪)" },
      { id: "2F781DA610D69539", name: "和樂邨 (往九龍灣/旺角)" },
      { id: "18492910339410B1", name: "翠屏邨翠桃樓" },
      { id: "5A519E870D1CD1D8", name: "翠屏邨翠柏樓" },
      { id: "C32A8A96E780653B", name: "翠屏邨翠桉樓" },
      { id: "3D5413D39943DC18", name: "觀塘(翠屏道)總站" }
    ];

    async function fetchAllETA() {
      // 1. 更新電視右上角時鐘
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

      let allArrivals = [];

      // 2. 抓取所有指定車站的全線班次資訊
      for (const station of STATIONS) {
        try {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${station.id}`);
          const json = await res.json();

          if (json.data) {
            json.data.forEach(item => {
              if (item.eta) {
                const etaTime = new Date(item.eta);
                const diffMins = Math.floor((etaTime - now) / 60000);

                // 只過濾出未來 60 分鐘內到達的車
                if (diffMins >= 0 && diffMins <= 60) {
                  allArrivals.push({
                    route: item.route,
                    dest: item.dest_tc,
                    stationName: station.name,
                    mins: diffMins,
                    etaTime: etaTime
                  });
                }
              }
            });
          }
        } catch (err) {
          console.error("抓取車站失敗:", station.name, err);
        }
      }

      // 3. 按照到達時間「剩餘幾分鐘」進行排序 (最快到的排最上面)
      allArrivals.sort((a, b) => a.mins - b.mins);

      // 4. 只取最快到達的前 8 條班次（電視一竪列最佳閱讀數量）
      const displayItems = allArrivals.slice(0, 8);
      const board = document.getElementById('board');
      board.innerHTML = '';

      if (displayItems.length === 0) {
        board.innerHTML = '<div style="font-size: 2vw; color: #888;">目前暫無即將到達的班次</div>';
        return;
      }

      // 5. 渲染大字體字卡
      displayItems.forEach(item => {
        let timeText = item.mins <= 0 ? "即將到達" : `${item.mins} 分鐘`;
        let isArriving = item.mins <= 0;

        const row = document.createElement('div');
        row.className = 'route-row';
        row.innerHTML = `
          <div class="route-info">
            <span class="route-badge">${item.route}</span>
            <div class="station-info">
              <span class="dest-name">往 ${item.dest}</span>
              <span class="station-name">上車點：${item.stationName}</span>
            </div>
          </div>
          <div class="time-box ${isArriving ? 'arriving' : ''}">${timeText}</div>
        `;
        board.appendChild(row);
      });
    }

    // 初次載入與每 20 秒自動刷新
    fetchAllETA();
    setInterval(fetchAllETA, 20000);
  </script>

</body>
</html>
