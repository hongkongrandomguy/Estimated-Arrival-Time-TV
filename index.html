<script>
  const SOUTH_ROUTES = [
    { route: "1A", dest: "Star Ferry", destZh: "尖沙咀碼頭", track: "KT537" },
    { route: "11X", dest: "Hung Hom Station", destZh: "紅磡站", track: "KT535" },
    { route: "13D", dest: "Metropark / Olympic", destZh: "維港灣", track: "KT537" },
    { route: "13M", dest: "Kwun Tong (Elegance Lane)", destZh: "觀塘（雅麗道）", track: "KT535" },
    { route: "13P", dest: "Cheung Sha Wan", destZh: "長沙灣（麗閣邨）", track: "KT537" },
    { route: "23", dest: "Kwun Tong Ferry", destZh: "觀塘碼頭", track: "KT535" },
    { route: "23M", dest: "Lok Wah", destZh: "樂華", track: "KT535" },
    { route: "26M", dest: "Kwun Tong ↺", destZh: "觀塘 ↺", track: "KT535" },
    { route: "28B", dest: "Kai Tak (Kai Ching Est)", destZh: "啟德（啟晴邨）", track: "KT536" },
    { route: "601", dest: "Admiralty (East)", destZh: "金鐘（東）", track: "KT536" },
    { route: "601P", dest: "Sheung Wan", destZh: "上環", track: "KT536" },
    { route: "89", dest: "Lek Yuen", destZh: "瀝源", track: "KT535" },
    { route: "89X", dest: "Sha Tin Station", destZh: "沙田站", track: "KT535" },
    { route: "93A", dest: "Kwun Tong Ferry", destZh: "觀塘碼頭", track: "KT535" },
    { route: "93K", dest: "Mong Kok East Station", destZh: "旺角東站", track: "KT537" },
    { route: "N293", dest: "Mong Kok (Park Central)", destZh: "旺角（柏景灣）", track: "KT536" }
  ];

  const NORTH_ROUTES = [
    { route: "1A", dest: "Central Sau Mau Ping", destZh: "中秀茂坪", track: "KT256" },
    { route: "11X", dest: "On Tat (North)", destZh: "安泰（北）", track: "KT255" },
    { route: "13D", dest: "Po Tat", destZh: "寶達", track: "KT255" },
    { route: "14H", dest: "Shun Lee ↺", destZh: "順利 ↺", track: "KT258" },
    { route: "23", dest: "Shun Lee ↺", destZh: "順利 ↺", track: "KT258" },
    { route: "23M", dest: "Shun Lee ↺", destZh: "順利 ↺", track: "KT258" },
    { route: "26M", dest: "Choi Hung", destZh: "彩虹", track: "KT258" },
    { route: "28B", dest: "Choi Fuk", destZh: "彩福", track: "KT257" },
    { route: "601", dest: "Po Tat", destZh: "寶達", track: "KT255" },
    { route: "601P", dest: "Po Tat", destZh: "寶達", track: "KT255" },
    { route: "93A", dest: "Po Lam", destZh: "寶林", track: "KT260" },
    { route: "93K", dest: "Tsui Lam", destZh: "翠林", track: "KT259" },
    { route: "N293", dest: "Sheung Tak", destZh: "尚德", track: "KT259" }
  ];

  // ★ 和樂邨站柱 stop ID（方向由「站柱集合」決定，不再靠目的地字串）
  // 南行（協和街南行）：KT535 / KT536 / KT537
  const SOUTH_STOP_IDS = ["073C44CE5FF431BC", "6CEE063506576EDB", "AE2A9F719AB5E353"];
  // 北行（協和街北行）：KT255 ~ KT260
  const NORTH_STOP_IDS = ["6530130BE25E909C", "17A8BC1197F76422", "55AE88BFD351F56D",
                          "B314CF2831F9C5F1", "072046BF00257739", "11EC0BEF4F8781A9"];

  let southDepartures = [];
  let northDepartures = [];
  let southScrollOffset = 0;
  let northScrollOffset = 0;
  let isDataLoaded = false;

  function getBadgeClass(route) {
    if (route.includes("A") || route.includes("X")) return "type-nozomi";
    if (route.startsWith("8") || route.startsWith("2")) return "type-hikari";
    if (route.startsWith("14") || route.startsWith("11") || route.startsWith("13")) return "type-kodama";
    return "type-local";
  }

  function getCustomWarningStyle(message) {
    if (message.includes("一號")) return { icon: "t1.png", text: "Signal No. 1", bg: "#e11d48" };
    if (message.includes("三號")) return { icon: "t3.png", text: "Signal No. 3", bg: "#e11d48" };
    if (message.includes("季候風")) return { icon: "monsoon.png", text: "Monsoon Wind", bg: "#059669" };
    if (message.includes("黃色暴雨")) return { icon: "yellow-rain.png", text: "Amber Rainstorm", bg: "#ca8a04" };
    if (message.includes("紅色暴雨")) return { icon: "red-rain.png", text: "Red Rainstorm", bg: "#dc2626" };
    if (message.includes("黑色暴雨")) return { icon: "black-rain.png", text: "Black Rainstorm", bg: "#111827" };
    if (message.includes("山泥傾瀉")) return { icon: "landslip.png", text: "Landslip Warning", bg: "#b45309" };
    if (message.includes("雷暴")) return { icon: "thunder.png", text: "Thunderstorm", bg: "#d97706" };
    if (message.includes("寒冷")) return { icon: "cold.png", text: "Cold Weather", bg: "#2563eb" };
    if (message.includes("酷熱")) return { icon: "hot.png", text: "Very Hot Weather", bg: "#d97706" };
    if (message.includes("水浸")) return { icon: "nt-flood.png", text: "Flooding Warning", bg: "#2563eb" };
    return { icon: "t1.png", text: message, bg: "#dc2626" };
  }

  async function fetchWeatherData() {
    try {
      const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en');
      if (res.ok) {
        const data = await res.json();
        if (data.temperature && data.temperature.data) {
          const hkoTemp = data.temperature.data.find(t => t.place === "Hong Kong Observatory");
          if (hkoTemp) document.getElementById('temp-text').innerText = `${hkoTemp.value}°C`;
        }
        document.getElementById('weather-desc').innerText = "HKO Weather";

        const warnContainer = document.getElementById('warning-container');
        warnContainer.innerHTML = '';
        if (data.warningMessage && Array.isArray(data.warningMessage) && data.warningMessage.length > 0) {
          data.warningMessage.forEach(msg => {
            const custom = getCustomWarningStyle(msg);
            const badge = document.createElement('div');
            badge.className = 'warn-badge';
            badge.style.backgroundColor = custom.bg;
            badge.innerHTML = `<img src="${custom.icon}" alt="icon"> <span>${custom.text}</span>`;
            badge.title = msg;
            warnContainer.appendChild(badge);
          });
        }
      }
    } catch (e) {
      document.getElementById('weather-desc').innerText = "Weather Offline";
    }
  }

  // ★ 新：抓取一組站柱的 ETA。方向由呼叫端（南/北行 ID 集合）決定
  async function fetchDirectionEtas(stopIds) {
    const results = await Promise.all(stopIds.map(id =>
      fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${id}`)
        .then(res => res.ok ? res.json() : null)
        .catch(() => null)
    ));
    const etas = [];
    const seenRoutes = new Set();   // 有返回該路線（即使 eta 為 null）
    results.forEach(json => {
      if (!json || !Array.isArray(json.data)) return;
      json.data.forEach(item => {
        if (!item.route) return;
        seenRoutes.add(item.route);
        if (item.eta) {             // ★ eta 可能為 null（當下無即將開出班次）
          const t = new Date(item.eta);
          if (!isNaN(t.getTime())) etas.push({ route: item.route, etaTime: t });
        }
      });
    });
    return { etas, seenRoutes };
  }

  async function fetchAPIData() {
    try {
      const [south, north] = await Promise.all([
        fetchDirectionEtas(SOUTH_STOP_IDS),
        fetchDirectionEtas(NORTH_STOP_IDS)
      ]);
      southDepartures = buildNormalizedList(SOUTH_ROUTES, south);
      northDepartures = buildNormalizedList(NORTH_ROUTES, north);
      isDataLoaded = true;
      renderBoards();
    } catch (e) {
      console.error("API Fetch Error:", e);
    }
  }

  // ★ 改：只按路線編號匹配（同方向站柱內不會有同號路線的對向車）
  function buildNormalizedList(routeConfig, { etas, seenRoutes }) {
    const now = Date.now();
    return routeConfig.map(cfg => {
      const upcoming = etas
        .filter(e => e.route === cfg.route && e.etaTime.getTime() >= now - 10000)
        .sort((a, b) => a.etaTime - b.etaTime);
      return {
        route: cfg.route,
        dest: cfg.dest,
        destZh: cfg.destZh,
        track: cfg.track,
        etaTime: upcoming.length ? upcoming[0].etaTime : null,
        servesStop: seenRoutes.has(cfg.route)   // 路線確實途經此站，只是暫時無班次
      };
    }).sort((a, b) => a.route.localeCompare(b.route, 'en', { numeric: true }));
  }

  function renderBoardHTML(departures) {
    if (!isDataLoaded) {
      return `<div style="text-align:center; padding: 2vw; color: #64748b; font-weight:400;">Loading...</div>`;
    }
    if (departures.length === 0) {
      return `<div style="text-align:center; padding: 3vw; color: #94a3b8; font-weight:400; font-size:0.9vw;">No Data Available</div>`;
    }

    const now = new Date();
    let html = '';
    departures.forEach(item => {
      let timeStr = "--:--";
      let statusMain = "No Info";
      let statusSub = "N/A";
      let statusClass = "status-none";

      if (item.etaTime) {
        const diffSecs = Math.floor((item.etaTime - now) / 1000);
        const diffMins = Math.floor(diffSecs / 60);
        timeStr = item.etaTime.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
        statusClass = "";

        if (diffSecs <= 30 && diffSecs >= -10) {
          statusMain = "Arriving";
          statusSub = "ARRIVING";
        } else {
          const displayMins = Math.max(0, diffMins);
          statusMain = `<span class="status-num">${displayMins}</span> min${displayMins === 1 ? '' : 's'}`;
          statusSub = `${Math.max(0, diffSecs % 60)} sec`;
        }
      } else if (item.servesStop) {
        // ★ 路線有途經但 API 返回 eta:null（如 13P/601P/N293 日間）→ 顯示「無即將班次」而非 No Info
        statusMain = "No Departure";
        statusSub = "NO SCHEDULED BUS";
      }

      html += `
        <div class="train-row">
          <div>
            <div class="train-badge ${getBadgeClass(item.route)}">${item.route}</div>
          </div>
          <div class="time-col">
            <div class="time-main">${timeStr}</div>
            <div class="time-sub">${item.etaTime ? 'Scheduled' : '--'}</div>
          </div>
          <div class="dest-col">
            <div class="dest-main">${item.dest}</div>
            <div class="dest-sub">${item.destZh}</div>
          </div>
          <div class="track-col">
            <div class="track-box">${item.track}</div>
          </div>
          <div class="status-col">
            <div class="status-main ${statusClass}">${statusMain}</div>
            <div class="status-sub">${statusSub}</div>
          </div>
        </div>
      `;
    });
    return html;
  }

  function renderBoards() {
    document.getElementById('south-body').innerHTML = renderBoardHTML(southDepartures);
    document.getElementById('north-body').innerHTML = renderBoardHTML(northDepartures);
  }

  function tickRealtime() {
    const now = new Date();
    document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
    document.getElementById('date-text').innerText = now.toLocaleDateString('en-GB', { month: 'numeric', day: 'numeric', weekday: 'short' });
    if (isDataLoaded) renderBoards();
  }

  function autoScrollEngine() {
    const sWrap = document.getElementById('south-wrap');
    const sBody = document.getElementById('south-body');
    if (sWrap && sBody && sBody.scrollHeight > sWrap.clientHeight) {
      const maxScroll = sBody.scrollHeight - sWrap.clientHeight + 10;
      southScrollOffset += 64;
      if (southScrollOffset > maxScroll) southScrollOffset = 0;
      sBody.style.transform = `translateY(-${southScrollOffset}px)`;
    }
    const nWrap = document.getElementById('north-wrap');
    const nBody = document.getElementById('north-body');
    if (nWrap && nBody && nBody.scrollHeight > nWrap.clientHeight) {
      const maxScroll = nBody.scrollHeight - nWrap.clientHeight + 10;
      northScrollOffset += 64;
      if (northScrollOffset > maxScroll) northScrollOffset = 0;
      nBody.style.transform = `translateY(-${northScrollOffset}px)`;
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    fetchAPIData();
    fetchWeatherData();
    setInterval(tickRealtime, 1000);
    setInterval(fetchAPIData, 15000);
    setInterval(fetchWeatherData, 60000);
    setInterval(autoScrollEngine, 5000);
  });
</script>
