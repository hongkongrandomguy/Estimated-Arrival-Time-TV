<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>和樂邨 & 翠屏邨 實時巴士看板</title>
  <style>
    body {
      margin: 0;
      padding: 2vw;
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .header {
      font-size: 2.5vw;
      font-weight: 800;
      color: #aaa;
      margin-bottom: 1.5vw;
      border-bottom: 2px solid #333;
      padding-bottom: 0.8vw;
      display: flex;
      justify-content: space-between;
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 1.2vw;
    }

    .route-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a1a;
      padding: 1.2vw 2vw;
      border-radius: 0.8vw;
      border-left: 0.8vw solid #00d26a;
    }

    .route-info {
      display: flex;
      align-items: center;
      gap: 1.5vw;
    }

    .route-badge {
      font-size: 3vw;
      font-weight: 900;
      background: #ffd600;
      color: #000;
      padding: 0.3vw 1vw;
      border-radius: 0.5vw;
      min-width: 5.5vw;
      text-align: center;
    }

    .station-info {
      display: flex;
      flex-direction: column;
    }

    .station-name {
      font-size: 1.4vw;
      color: #888;
    }

    .dest-name {
      font-size: 2.2vw;
      font-weight: 700;
      color: #ffffff;
    }

    .time-box {
      font-size: 3.5vw;
      font-weight: 900;
      color: #00e676;
    }

    .arriving {
      color: #ff3d00 !important;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="header">
    <span>和樂邨 / 翠屏邨 巴士看板 (僅顯示下一班)</span>
    <span id="clock">00:00</span>
  </div>

  <div class="board" id="board">
    <div style="font-size: 2vw; color: #888;">正更新最新班次...</div>
  </div>

  <script>
    // 車站設定
    const STATIONS = [
      { id: "A28469C365DE1A45", name: "和樂邨 (往觀塘/秀茂坪)" },
      { id: "2F781DA610D69539", name: "和樂邨 (往九龍灣/旺角)" },
      { id: "18492910339410B1", name: "翠屏邨翠桃樓" },
      { id: "5A519E870D1CD1D8", name: "翠屏邨翠柏樓" },
      { id: "C32A8A96E780653B", name: "翠屏邨翠桉樓" },
      { id: "3D5413D39943DC18", name: "觀塘(翠屏道)總站" }
    ];

    // 途經和樂邨/翠屏邨的真實路線白名單 (自動過濾雜訊路線)
    const VALID_ROUTES = ["1A", "11B", "11C", "11X", "13M", "13P", "89", "89X", "234C", "234D"];

    async function fetchAllETA() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

      // 用 Map 來確保「每條路線在每個車站」只保留【下一趟】（最快到的那一班）
      const nextBusesMap = new Map();

      for (const station of STATIONS) {
        try {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${station.id}`);
          const json = await res.json();

          if (json.data) {
            json.data.forEach(item => {
              // 1. 檢查路線是否為途經的真實路線
              if (item.eta && VALID_ROUTES.includes(item.route)) {
                const etaTime = new Date(item.eta);
                const diffMins = Math.floor((etaTime - now) / 60000);

                if (diffMins >= 0 && diffMins <= 60) {
                  // 建立唯一 key：路線 + 目的地 + 車站
                  const key = `${item.route}-${item.dest_tc}-${station.name}`;

                  // 2. 核心 logic：只保留時間最小（最近）的那一班
                  if (!nextBusesMap.has(key) || diffMins < nextBusesMap.get(key).mins) {
                    nextBusesMap.set(key, {
                      route: item.route,
                      dest: item.dest_tc,
                      stationName: station.name,
                      mins: diffMins
                    });
                  }
                }
              }
            });
          }
        } catch (err) {
          console.error("抓取失敗:", station.name, err);
        }
      }

      // 轉為陣列並按剩餘時間由近到遠排序
      const displayItems = Array.from(nextBusesMap.values()).sort((a, b) => a.mins - b.mins);
      const board = document.getElementById('board');
      board.innerHTML = '';

      if (displayItems.length === 0) {
        board.innerHTML = '<div style="font-size: 2vw; color: #888;">目前暫無即將到達的班次</div>';
        return;
      }

      // 渲染畫面（每條路線只佔一行）
      displayItems.forEach(item => {
        let timeText = item.mins <= 0 ? "即將到達" : `${item.mins} 分鐘`;
        let isArriving = item.mins <= 0;

        const row = document.createElement('div');
        row.className = 'route-row';
        row.innerHTML = `
          <div class="route-info">
            <span class="route-badge">${item.route}</span>
            <div class="station-info">
              <span class="dest-name">往 ${item.dest}</span>
              <span class="station-name">上車點：${item.stationName}</span>
            </div>
          </div>
          <div class="time-box ${isArriving ? 'arriving' : ''}">${timeText}</div>
        `;
        board.appendChild(row);
      });
    }

    fetchAllETA();
    setInterval(fetchAllETA, 20000);
  </script>

</body>
</html>
