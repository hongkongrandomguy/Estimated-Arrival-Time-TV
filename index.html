<script>
    const COLUMNS_CONFIG = [
      {
        elementId: "col-1", wrapperId: "wrap-1", colKey: "col1",
        routes: [
          { route: "1A", dir: "O", stopId: "KT535", dest: "尖沙咀碼頭", destEn: "Star Ferry" },
          { route: "11X", dir: "I", stopId: "KT535", dest: "紅磡站", destEn: "Hung Hom Station" },
          { route: "13D", dir: "O", stopId: "KT535", dest: "維港灣", destEn: "Island Harbourview" },
          { route: "13M", dir: "O", stopId: "KT535", dest: "觀塘 (雅麗道)", destEn: "Kwun Tong" },
          { route: "13P", dir: "O", stopId: "KT535", dest: "長沙灣 (麗閣邨)", destEn: "Cheung Sha Wan" },
          { route: "23", dir: "I", stopId: "KT535", dest: "觀塘碼頭", destEn: "Kwun Tong Ferry" },
          { route: "23M", dir: "O", stopId: "KT535", dest: "樂華", destEn: "Lok Wah" },
          { route: "26M", dir: "I", stopId: "KT535", dest: "觀塘", destEn: "Kwun Tong" },
          { route: "28B", dir: "O", stopId: "KT535", dest: "啟德 (啟晴邨)", destEn: "Kai Tak" },
          { route: "89", dir: "O", stopId: "KT535", dest: "瀝源", destEn: "Lek Yuen" },
          { route: "89X", dir: "O", stopId: "KT535", dest: "沙田站", destEn: "Sha Tin Station" },
          { route: "93A", dir: "I", stopId: "KT535", dest: "觀塘碼頭", destEn: "Kwun Tong Ferry" },
          { route: "93K", dir: "O", stopId: "KT535", dest: "旺角東站", destEn: "Mong Kok East" },
          { route: "N293", dir: "O", stopId: "KT535", dest: "旺角 (柏景灣)", destEn: "Mong Kok" }
        ]
      },
      {
        elementId: "col-2", wrapperId: "wrap-2", colKey: "col2",
        routes: [
          { route: "1A", dir: "I", stopId: "KT511", dest: "中秀茂坪", destEn: "Sau Mau Ping" },
          { route: "11X", dir: "O", stopId: "KT511", dest: "安泰 (北)", destEn: "On Tai (North)" },
          { route: "13D", dir: "I", stopId: "KT511", dest: "寶達", destEn: "Po Tat" },
          { route: "14H", dir: "O", stopId: "KT511", dest: "順利", destEn: "Shun Lee" },
          { route: "23", dir: "O", stopId: "KT511", dest: "順利", destEn: "Shun Lee" },
          { route: "23M", dir: "I", stopId: "KT511", dest: "順利", destEn: "Shun Lee" },
          { route: "26M", dir: "O", stopId: "KT511", dest: "彩虹", destEn: "Choi Hung" },
          { route: "28B", dir: "I", stopId: "KT511", dest: "彩福", destEn: "Choi Fook" },
          { route: "93A", dir: "O", stopId: "KT511", dest: "寶林", destEn: "Po Lam" },
          { route: "93K", dir: "I", stopId: "KT511", dest: "翠林", destEn: "Tsui Lam" },
          { route: "N293", dir: "I", stopId: "KT511", dest: "尚德", destEn: "Sheung Tak" }
        ]
      },
      {
        elementId: "col-3", wrapperId: "wrap-3", colKey: "col3",
        routes: [
          { route: "11B", dir: "O", stopId: "TS055", dest: "九龍城碼頭", destEn: "Kowloon City" },
          { route: "11C", dir: "O", stopId: "TS055", dest: "竹園邨", destEn: "Chuk Yuen Estate" },
          { route: "89C", dir: "O", stopId: "TS055", dest: "恆安", destEn: "Heng On" },
          { route: "89X", dir: "O", stopId: "TS055", dest: "沙田站", destEn: "Sha Tin Station" }
        ]
      },
      {
        elementId: "col-4", wrapperId: "wrap-4", colKey: "col4",
        routes: [
          { route: "11B", dir: "I", stopId: "TS020", dest: "觀塘翠屏道", destEn: "Tsui Ping Rd" },
          { route: "11C", dir: "I", stopId: "TS020", dest: "上秀茂坪", destEn: "Sau Mau Ping" },
          { route: "13M", dir: "I", stopId: "TS020", dest: "寶達", destEn: "Po Tat" },
          { route: "89C", dir: "I", stopId: "TS020", dest: "觀塘翠屏道", destEn: "Tsui Ping Rd" }
        ]
      }
    ];

    let fullDataStore = {};
    let scrollOffsets = { "col-1": 0, "col-2": 0, "col-3": 0, "col-4": 0 };

    function getBadgeClass(route) {
      if (route.includes("A") || route.includes("X") || route.startsWith("6")) return "type-rapid";
      if (route.startsWith("8") || route.startsWith("2")) return "type-express";
      if (route.startsWith("14") || route.startsWith("11")) return "type-semi";
      return "type-local";
    }

    function getOrderLabel(index) {
      if (index === 0) return { hk: "即班", en: "1st" };
      if (index === 1) return { hk: "下班", en: "2nd" };
      if (index === 2) return { hk: "後班", en: "3rd" };
      return { hk: "普通", en: `${index + 1}th` };
    }

    function initDOM() {
      COLUMNS_CONFIG.forEach(col => {
        const container = document.getElementById(col.elementId);
        container.innerHTML = '';
        fullDataStore[col.colKey] = {};

        col.routes.forEach((r, idx) => {
          fullDataStore[col.colKey][r.route] = { targetTime: null };
          const order = getOrderLabel(idx);

          const row = document.createElement('div');
          row.className = 'route-row';
          row.innerHTML = `
            <div class="order-col">
              <div class="order-hk">${order.hk}</div>
              <div class="order-en">${order.en}</div>
            </div>
            <div>
              <div class="type-badge ${getBadgeClass(r.route)}">${r.route}</div>
            </div>
            <div class="dest-col">
              <div class="dest-main">${r.dest}</div>
              <div class="dest-sub">${r.destEn.toUpperCase()}</div>
            </div>
            <div class="time-col">
              <div class="time-main" id="time-${col.colKey}-${r.route}">--:--</div>
              <div class="time-sub" id="sub-${col.colKey}-${r.route}">無預定</div>
            </div>
          `;
          container.appendChild(row);
        });
      });
    }

    function updateLCDValue(colKey, route, timeVal, subVal) {
      const timeElem = document.getElementById(`time-${colKey}-${route}`);
      const subElem = document.getElementById(`sub-${colKey}-${route}`);
      if (timeElem) timeElem.innerText = timeVal;
      if (subElem) subElem.innerText = subVal;
    }

    function tickRealtime() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });

      COLUMNS_CONFIG.forEach(col => {
        col.routes.forEach(r => {
          const item = fullDataStore[col.colKey]?.[r.route];

          if (item && item.targetTime) {
            const diffSecs = Math.floor((item.targetTime - now) / 1000);
            const diffMins = Math.floor(diffSecs / 60);

            if (diffSecs > -30) {
              if (diffSecs <= 30) {
                updateLCDValue(col.colKey, r.route, "即將", "即將到站");
              } else {
                const depTimeStr = item.targetTime.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
                updateLCDValue(col.colKey, r.route, depTimeStr, `${diffMins} 分鐘`);
              }
            } else {
              updateLCDValue(col.colKey, r.route, "--:--", "無預定");
            }
          } else {
            updateLCDValue(col.colKey, r.route, "--:--", "無預定");
          }
        });
      });
    }

    // 採用分批 API 請求，防範 API 頻率限制
    async function fetchAPIData() {
      for (const col of COLUMNS_CONFIG) {
        for (const r of col.routes) {
          try {
            // 使用更寬鬆的九巴車站 ETA API 查詢
            const url = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${r.stopId}`;
            const res = await fetch(url);
            if (!res.ok) continue;
            
            const json = await res.json();

            if (json.data && json.data.length > 0) {
              // 篩選出匹配該路線且有時間數據的第一班車
              const match = json.data.find(item => item.route === r.route && item.eta);
              if (match && match.eta) {
                fullDataStore[col.colKey][r.route].targetTime = new Date(match.eta);
              } else {
                fullDataStore[col.colKey][r.route].targetTime = null;
              }
            }
          } catch (e) {
            console.warn(`獲取 ${r.route} 數據出錯:`, e);
          }
        }
      }
      tickRealtime();
    }

    function autoScrollEngine() {
      COLUMNS_CONFIG.forEach(col => {
        const wrapper = document.getElementById(col.wrapperId);
        const container = document.getElementById(col.elementId);
        if (!wrapper || !container) return;

        const wrapperHeight = wrapper.clientHeight;
        const containerHeight = container.scrollHeight;

        if (containerHeight > wrapperHeight) {
          const maxScroll = containerHeight - wrapperHeight + 10;
          scrollOffsets[col.elementId] += 58;
          if (scrollOffsets[col.elementId] > maxScroll) scrollOffsets[col.elementId] = 0;
          container.style.transform = `translateY(-${scrollOffsets[col.elementId]}px)`;
        } else {
          container.style.transform = `translateY(0px)`;
          scrollOffsets[col.elementId] = 0;
        }
      });
    }

    initDOM();
    fetchAPIData();
    setInterval(tickRealtime, 1000);
    setInterval(fetchAPIData, 20000);
    setInterval(autoScrollEngine, 4000);
  </script>
