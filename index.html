<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>電視實時到站看板</title>
  <style>
    /* 全螢幕黑底，適合電視 OLED/LCD 顯色與省電 */
    body {
      margin: 0;
      padding: 3vw;
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden; /* 避免電視出現捲動條 */
    }

    /* 大標題 */
    .header {
      font-size: 3vw;
      font-weight: 800;
      color: #888;
      margin-bottom: 2vw;
      border-bottom: 2px solid #333;
      padding-bottom: 1vw;
      display: flex;
      justify-content: space-between;
    }

    /* 一竪列看板容器 */
    .board {
      display: flex;
      flex-direction: column;
      gap: 1.5vw;
    }

    /* 單一路線卡片 */
    .route-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a1a;
      padding: 2vw 3vw;
      border-radius: 1vw;
      border-left: 1vw solid #00d26a; /* 綠色辨識條 */
    }

    /* 路線名稱與站名 */
    .route-info {
      display: flex;
      align-items: center;
      gap: 2vw;
    }

    .route-badge {
      font-size: 4vw;
      font-weight: 900;
      background: #ffd600;
      color: #000;
      padding: 0.5vw 1.5vw;
      border-radius: 0.5vw;
      line-height: 1;
    }

    .station-name {
      font-size: 3.5vw;
      font-weight: 700;
      color: #eaeaea;
    }

    /* 到站時間巨型字體 */
    .time-box {
      font-size: 5vw;
      font-weight: 900;
      color: #00e676; /* 顯眼綠色 */
      letter-spacing: -1px;
    }

    /* 即將到站/已到達的特別顏色 */
    .arriving {
      color: #ff3d00 !important; /* 超級醒目的紅色/橘色 */
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <div class="header">
    <span>實時班次看板</span>
    <span id="clock">00:00</span>
  </div>

  <!-- 一竪列顯示多條資訊 -->
  <div class="board" id="board">
    <div class="route-row">
      <div class="route-info">
        <span class="route-badge">1A</span>
        <span class="station-name">尖沙咀碼頭</span>
      </div>
      <div class="time-box">載入中...</div>
    </div>
  </div>

  <script>
    // 範例：監控九巴 1A 在指定站點的班次
    const STOP_ID = "001000"; 
    const ROUTE = "1A";

    async function updateETA() {
      // 1. 更新右上角電視大時鐘
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

      const board = document.getElementById('board');

      try {
        const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${STOP_ID}/${ROUTE}/1`);
        const result = await response.json();

        if (!result.data || result.data.length === 0) return;

        // 取出最近 3 班車
        const etas = result.data.slice(0, 3);
        board.innerHTML = '';

        etas.forEach(item => {
          if (!item.eta) return;

          // 計算剩餘分鍾數
          const etaTime = new Date(item.eta);
          const diffMs = etaTime - new Date();
          const diffMins = Math.floor(diffMs / 60000);

          let displayText = "";
          let isArriving = false;

          if (diffMins <= 0) {
            displayText = "即將到達";
            isArriving = true;
          } else {
            displayText = `${diffMins} 分鐘`;
          }

          // 動態生成適合電視遠看的大字卡
          const row = document.createElement('div');
          row.className = 'route-row';
          row.innerHTML = `
            <div class="route-info">
              <span class="route-badge">${item.route}</span>
              <span class="station-name">${item.dest_tc} 方向</span>
            </div>
            <div class="time-box ${isArriving ? 'arriving' : ''}">${displayText}</div>
          `;
          board.appendChild(row);
        });

      } catch (error) {
        console.error("API 載入失敗:", error);
      }
    }

    // 初次載入與自動刷新 (電視監控建議 15-20 秒刷新一次)
    updateETA();
    setInterval(updateETA, 20000);
  </script>

</body>
</html>
